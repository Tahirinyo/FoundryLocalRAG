[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-local-rag"
version = "0.1.0"
description = "A small local document question-and-answer assistant."
requires-python = ">=3.11,<3.14"
dependencies = ["foundry-local-sdk-winml==1.2.4"]

[project.scripts]
foundry-local-rag = "foundry_local_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
